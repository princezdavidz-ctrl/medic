name: Import source applications

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Clone source repositories
        run: |
          git clone --depth 1 https://github.com/princezdavidz-ctrl/medical2.git /tmp/medical2
          git clone --depth 1 https://github.com/princezdavidz-ctrl/doctor-review-dashboard.git /tmp/doctor-review-dashboard
          git clone --depth 1 https://github.com/princezdavidz-ctrl/medical.git /tmp/medical

      - name: Copy source files into destination folders
        run: |
          mkdir -p Patient Doctors Admin
          rsync -a --delete --exclude='.git/' --exclude='.env' --exclude='.env.*' /tmp/medical2/ Patient/
          rsync -a --delete --exclude='.git/' --exclude='.env' --exclude='.env.*' /tmp/doctor-review-dashboard/ Doctors/
          rsync -a --delete --exclude='.git/' --exclude='.env' --exclude='.env.*' /tmp/medical/ Admin/
          find Patient Doctors Admin -type d \( -name .git -o -name node_modules -o -name .gradle \) -prune -exec rm -rf {} +

      - name: Verify imported folders
        run: |
          test -n "$(find Patient -type f -print -quit)"
          test -n "$(find Doctors -type f -print -quit)"
          test -n "$(find Admin -type f -print -quit)"
          echo "Patient files: $(find Patient -type f | wc -l)"
          echo "Doctors files: $(find Doctors -type f | wc -l)"
          echo "Admin files: $(find Admin -type f | wc -l)"
          if find Patient Doctors Admin -type f -name '.env*' | grep -q .; then
            echo "Environment files must not be committed."
            exit 1
          fi

      - name: Commit and push imported applications
        run: |
          git add Patient Doctors Admin
          if git diff --cached --quiet; then
            echo "No source changes to import."
            exit 0
          fi
          git commit -m "Import patient, doctor, and admin applications"
          git push origin HEAD:main
